name: helm Deployment pipeline

on:
  push:
    branches:
      - main

env:
  EKS_CLUSTER_NAME: SampleCluster
  HELM_RELEASE_NAME: ott-platform
  HELM_CHART_PATH: .
  NAMESPACE: media

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: siva-k8s
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  deploy:
    name: deploy the docker container into k8s
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Installing the kubectl in the github action runner 
      - name: configure EKS cluster with kubectl
        run: |
          aws eks update-kubeconfig --region us-west-2 --name SampleCluster
      
      # - name: replacing the image-id with github.sha
      #   run: |
      #     sed -i "s|IMAGE_TAG|${{ github.sha }}|g" K8s/deployment.yaml

      # - name: Deploy to EKS cluster
      #   run: |
      #     kubectl apply -f K8s/deployment.yaml
      #     kubectl apply -f K8s/service.yaml
      #     kubectl apply -f K8s/ingress.yaml

      - name: helm upgrade
        run: |
          helm upgrade --install $HELM_RELEASE_NAME $HELM_CHART_PATH --namespae $NAMESPACE --set image.tag=${{ github.sha }} --wait --timeout 2m
